# Render Blueprint for the Staff Directory.
#
# ============================================================================
# WARNING - THIS BLUEPRINT DOES NOT DESCRIBE THE CURRENT LIVE DEPLOYMENT.
# Do NOT apply ("sync") this file to the existing Render services.
#
# The live system runs as TWO separate Render services:
#   * backend  : staff-directory-gc6d           (Express API + PostgreSQL)
#   * frontend : siwes-staff-directory-static   (static site serving public/,
#                forwarding /api/* to the backend via a dashboard rewrite)
#
# The single service named below ("staff-directory") is NOT the live backend
# name and does not reproduce that topology. Connecting or syncing this
# Blueprint could create a DUPLICATE service or alter the working deployment.
# The file is retained for historical reference only. The two-service topology
# has deliberately not been added here.
# ============================================================================
#
# Secrets are never stored in this file:
#   * DATABASE_URL is declared with `sync: false`, so Render prompts for it in
#     the Dashboard instead of committing it.
#   - The Supabase CA certificate is uploaded in the Render Dashboard under the
#     service's Environment > Secret Files as a file named
#     "supabase-root-ca.crt". Render mounts it at
#     /etc/secrets/supabase-root-ca.crt, which is the fixed path DB_SSL_CA
#     points at below. TLS stays fully verified (the default); DB_SSL is left
#     unset on purpose.
#
# See the README "Deploying to Render (PostgreSQL/Supabase)" section for the
# full step-by-step and the one-time data import.
services:
  - type: web
    name: staff-directory
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/supabase-root-ca.crt
